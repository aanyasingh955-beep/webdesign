<html lang="en">
  <head>
    <title>Fitcheck</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Fixed font links to properly fetch fonts from Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
      #welcome-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #f0f8ff;
        color: #000080;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .screen-content {
        text-align: center;
        font-family: sans-serif;
      }

      .hidden {
        opacity: 0;
        pointer-events: none;
      }

      .logo-text {
        font-family: 'Alex Brush', cursive;
        margin: 0;
      }
      h1.logo-text {
        font-size: 4rem;
      }
      p.logo-text {
        font-size: 1.5rem;
      }

      /* FIXED: Added '#' to match id="main-content" and added missing hyphen to border-box */
      #main-content {
        width: 100vw;
        height: 100vh;
        background-color: #4A5361;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box; 
        padding: 40px 20px;
      }

      /* FIXED: Added missing closing brace '}' at the end of this block and fixed the text color hex code */
      .main-brand-title {
        color: #E2E5EB;
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 2.5rem;
        margin: 0;
        margin-top: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
      }

      .auth-button-group {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        max-width: 320px;
      }

      /* FIXED: Added missing semicolons and formatting values */
      .custom-btn {
        background-color: #1A242F;
        color: #E3E5EB;
        font-family: 'Orbitron', sans-serif;
        font-size: 2rem;
        padding: 16px;
        border: 2px solid #0D131A;
        border-radius: 16px;
        cursor: pointer;
        width: 100%;
        text-align: center;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        transition: transform 0.1s ease;
      }

      /* FIXED: Removed space between colon and active, fixed typo 'transorm' to 'transform' */
      .custom-btn:active {
        transform: scale(0.98);
      }

      /* FIXED: Corrected spelling to match class name "main-brand-tagline" */
      .main-brand-tagline {
        color: #E2E5EB;
        font-family: 'Alex Brush', cursive;
        font-size: 1.6rem;
        font-weight: 400;
        margin: 0;
        margin-bottom: 20px;
        opacity: 0.9;
      }

      /* FIXED: Added '#' to target id="screen" */
      #screen {
        position: absolute;
        top: 20px;
        color: #FFFFFF;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>

    <div id="welcome-screen">
      <div class="screen-content">
        <h1 class="logo-text">Fitcheck</h1>
        <p class="logo-text">Outfits made easy</p>
      </div>
    </div>

    <div id="main-content">
      <!-- FIXED: Fixed broken HTML tags here -->
      <h2 class="main-brand-title">Fitcheck</h2>
      
      <!-- FIXED: Added missing closing bracket > -->
      <div class="auth-button-group">
        <button class="custom-btn" onclick="login()">Log In</button>
        <button class="custom-btn" onclick="signup()">Sign up</button>
      </div>

      <p class="main-brand-tagline">"Outfits made easy"</p>
      
      <!-- FIXED: Added missing closing bracket > -->
      <div id="screen"></div>
    </div>

    <script>
      setTimeout(() => {
        const welcomeScreen = document.getElementById('welcome-screen');
        if (welcomeScreen) {
          welcomeScreen.classList.add('hidden');
          setTimeout(() => {
            welcomeScreen.remove();
          }, 500);
        }
      }, 3000);

      function login() {
        document.getElementById("screen").innerHTML = "Logged in Successfully";
      }
      function signup() {
        document.getElementById("screen").innerHTML = "Signed up Successfully";
      }
    </script>
  </body>
</html>
  </html>
