<html lang="en">
  <head>
    <title>Fitcheck</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import url('https://googleapis.com');
     #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f0f8ff;
      color: #000080;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
      }

      .screen-content {
        text-align: center;
        font-family: sans-serif;
      }

      .hidden {
        opacity: 0;
        pointer-events: none;
      }
      @import url('https://googleapis.com');

      .logo-text {
        font-family: 'Alex Brush', cursive;
        margin: 0;
      }
      h1.logo-text {
        font-size: 4rem;
      }
      p.logo-text {
        font-size: 1.5rem;
      }
      button {
        background-color: blue;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="welcome-screen">
      <div class="screen-content">
        <h1 class="logo-text">Fitcheck</h1>
        <p class="logo-text">Outfits made easy</p>
      </div>
    </div>

    <div id="main-content">
      <h2>Fitcheck</h2>
      <p>Outfits made easy</p>
      <button onclick="login()">Log In</button>
      <button onclick="signup()">Sign up</button>

      <div id="screen" style="margin-top: 20px; font-weight: bold;"></div>
    </div>
    <script>
      setTimeout(() => {
        const welcomeScreen = document.getElementById('welcome-screen');
        if (welcomeScreen) {
          welcomeScreen.classList.add('hidden');
          setTimeout(() => {
            welcomeScreen.remove();
          }, 500);
        }
      },3000);

    function login() {
        document.getElementById("screen").innerHTML = "Logged up Successfully";
      }
     function signup() {
        document.getElementById("screen").innerHTML = "Signed up Successfully";
      }
      </script>
    </body>
  </html>
</html>
